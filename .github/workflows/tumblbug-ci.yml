# 교재 저장소 전용: 여러 단계 프로젝트가 한 저장소에 있어서, 4단계 폴더가 바뀔 때만 4단계 CI를 돌린다.
# 독자가 쓰는 파일은 projects/04-tumblbug-mvp/.github/workflows/ci.yml (프로젝트 폴더 = 저장소) 이다.
name: tumblbug CI

# 14주차부터: tumblbug-cd.yml 이 먼저 불러서 돌린다 (독자용 ci.yml 과 같음)
on:
  workflow_call:

defaults:
  run:
    working-directory: projects/04-tumblbug-mvp

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tumblbug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tumblbug_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:3100
      CRON_SECRET: ci-only-cron-secret-000000 # 예약 작업 주소 테스트용 (13주차)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/04-tumblbug-mvp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: projects/04-tumblbug-mvp/playwright-report
          retention-days: 7
