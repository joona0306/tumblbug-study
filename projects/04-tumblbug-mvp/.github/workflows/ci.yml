# CI(지속적 통합): 코드를 올리거나 PR을 만들 때마다 GitHub이 자동으로 검사한다.
# 하나라도 실패하면 PR 화면에 빨간 X가 뜬다 → 합치기 전에 고친다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트 전용 PostgreSQL을 Docker 컨테이너로 잠깐 띄운다 (6주차).
    # 매번 빈 DB에서 시작하므로 테스트끼리 영향을 주지 않고, 운영·개발 DB는 건드리지 않는다.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tumblbug_test
        ports: ["5432:5432"]
        # DB가 접속을 받을 준비가 될 때까지 기다린다
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 테스트용 값 (진짜 비밀값이 아니다 — 컨테이너 안에서만 쓰이고 사라진다)
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tumblbug_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치 (npm install 과 달리 버전을 바꾸지 않는다)
      - run: npm ci

      - name: 코드 검사 (ESLint)
        run: npm run lint

      - name: 타입 검사 (TypeScript)
        run: npm run typecheck

      - name: DB 마이그레이션 (빈 테스트 DB에 표 만들기)
        run: npm run db:migrate

      - name: 단위·DB 테스트 (Vitest)
        run: npm test

      - name: 예시 데이터 (흐름 테스트용 계정·프로젝트)
        run: npm run db:seed

      - name: 빌드
        run: npm run build

      - name: 흐름 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 흐름 테스트 (Playwright)
        run: npm run test:e2e

      # 흐름 테스트가 실패하면 보고서(스크린샷·과정 기록)를 내려받을 수 있게 올려 둔다
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
