# CI(지속적 통합): 코드를 올리거나 PR을 만들 때마다 GitHub이 자동으로 검사한다.
# 하나라도 실패하면 PR 화면에 빨간 X가 뜬다 → 합치기 전에 고친다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치 (npm install 과 달리 버전을 바꾸지 않는다)
      - run: npm ci

      - name: 코드 검사 (ESLint)
        run: npm run lint

      - name: 타입 검사 (TypeScript)
        run: npm run typecheck

      - name: 단위 테스트 (Vitest)
        run: npm test

      - name: 빌드
        run: npm run build

      - name: 흐름 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 흐름 테스트 (Playwright)
        run: npm run test:e2e

      # 흐름 테스트가 실패하면 보고서(스크린샷·과정 기록)를 내려받을 수 있게 올려 둔다
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
