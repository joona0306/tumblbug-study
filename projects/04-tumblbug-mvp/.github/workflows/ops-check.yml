# 운영 점검 자동 실행 (15주차) — 매일 아침 운영 DB 에 `npm run ops:check` 를 돌린다
# 문제가 있으면 이 작업이 실패하고 → GitHub 가 저장소 주인에게 실패 메일을 보낸다 (알림)
# 읽기만 한다 (DB 를 바꾸지 않는다). 운영 DB 주소는 GitHub "production" 환경의 DATABASE_URL 을 쓴다
name: Ops check

on:
  schedule:
    - cron: "0 22 * * *" # 매일 22:00 UTC = 한국 시간 아침 7시 (예약 작업이 자정에 돈 뒤)
  workflow_dispatch: # Actions 화면에서 "Run workflow" 로 바로 돌려 볼 수도 있다

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ops:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
