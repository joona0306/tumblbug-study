# EC2 서버에서 쓰는 compose 설정 (16주차) — 서버의 ~/moa 폴더에 올라간다
#   app   : GitHub(GHCR)에 올린 모아 이미지. 어떤 이미지인지는 배포 스크립트가 APP_IMAGE 로 알려 준다
#   caddy : 리버스 프록시 — 바깥의 80·443번 요청을 받아 HTTPS 를 처리하고 app 의 3000번으로 넘긴다
#           인증서(Let's Encrypt)를 알아서 받고, 만료 전에 알아서 갱신한다
#
# 값은 같은 폴더의 .env 에서 온다 (배포 워크플로가 GitHub Secrets 로 만든다 — git 에는 없다)
#   DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, SITE_ADDRESS

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE 가 없습니다 — deploy.sh 로 실행하세요}
    env_file: .env
    environment:
      APP_VERSION: ${APP_VERSION:-} # /api/health 의 commit — 지금 도는 코드가 어느 커밋인지
    restart: unless-stopped # 앱이 죽거나 서버가 재부팅되면 Docker 가 다시 켠다
    # ports 를 열지 않는다: 3000번은 바깥에서 못 들어오고, 같은 compose 안의 caddy 만 "app:3000" 으로 닿는다

  caddy:
    image: caddy:2.10
    ports:
      - "80:80" # 인증서 발급 확인용 + http → https 로 넘기기
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 가 없습니다} # 예: 3-34-218-244.sslip.io
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 받은 인증서를 보관 — 컨테이너를 다시 만들어도 다시 받지 않게
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
